<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Pizzaria</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">🍕 Painel Administrativo</div>
    <div>
      <a href="index.html">Ver Cardápio</a>
      <a href="#" id="logoutLink">Sair</a>
    </div>
  </nav>

  <div class="container">
    <h1>Gerenciar Pizzas</h1>

    <div class="card">
      <h2>Adicionar Nova Pizza</h2>
      <form id="pizzaForm">
        <div class="form-group">
          <!-- Modificado: Adicionado for="pizzaName" -->
          <label for="pizzaName">Nome</label>
          <input type="text" id="pizzaName" required>
        </div>
        <div class="form-group">
          <!-- Modificado: Adicionado for="pizzaDescription" -->
          <label for="pizzaDescription">Descrição</label>
          <textarea id="pizzaDescription" rows="3"></textarea>
        </div>
        <div class="form-group">
          <!-- Modificado: Adicionado for="pizzaPrice" -->
          <label for="pizzaPrice">Preço (R$)</label>
          <input type="number" id="pizzaPrice" step="0.01" min="0" required>
        </div>
        <div class="form-group">
          <!-- Modificado: Adicionado for="pizzaImage" -->
          <label for="pizzaImage">URL da Imagem</label>
          <input type="url" id="pizzaImage" placeholder="https://...">
        </div>
        <button type="submit" class="btn">Adicionar</button>
      </form>
    </div>

    <div class="card">
      <h2>Lista de Pizzas</h2>
      <table id="pizzaTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Preço</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Pedidos</h2>
      <table id="ordersTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Itens</th>
            <th>Total</th>
            <th>Status</th>
            <th>Data</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
