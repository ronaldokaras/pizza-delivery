<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizzaria Delícia - Cardápio</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">🍕 Pizzaria Delícia</div>
    <div id="navLinks">
      <a href="login.html" id="loginLink">Entrar</a>
      <a href="register.html" id="registerLink">Cadastrar</a>
      <a href="user.html" id="userLink" class="hidden">Meus Pedidos</a>
      <a href="admin.html" id="adminLink" class="hidden">Admin</a>
      <a href="#" id="logoutLink" class="hidden">Sair</a>
    </div>
  </nav>

  <div class="container">
    <h1>Nosso Cardápio</h1>

    <div class="card">
      <input type="text" id="searchInput" placeholder="Buscar pizza..." oninput="filterPizzas()">
    </div>

    <div id="pizzaGrid" class="grid"></div>

    <div class="card cart-card">
      <h2>🛒 Carrinho</h2>
      <div id="cartContainer">
        <ul id="cartItems" class="cart-items"></ul>
        <p id="cartTotal" class="cart-total">Total: R$ 0,00</p>
        <button id="checkoutBtn" class="btn">Finalizar Pedido</button>
      </div>
      <p id="cartEmpty" class="cart-empty">Seu carrinho está vazio.</p>
    </div>
  </div>

  <!-- Modal de Pagamento -->
  <div id="paymentModal" class="modal hidden">
    <div class="modal-content">
      <span class="close" onclick="closePaymentModal()">&times;</span>
      <h2>Finalizar Pedido</h2>
      <p id="paymentTotal">Total: R$ 0,00</p>
      <div class="form-group">
        <label>Endereço de entrega</label>
        <input type="text" id="deliveryAddress" placeholder="Rua, número, bairro, cidade" required>
      </div>
      <div class="form-group">
        <label>E-mail para contato</label>
        <input type="email" id="contactEmail" placeholder="seuemail@exemplo.com">
      </div>
      <div class="form-group">
        <label for="paymentMethod">Forma de Pagamento</label>
        <select id="paymentMethod">
          <option value="pix">Pix</option>
          <option value="cartao">Cartão de Crédito</option>
          <option value="dinheiro">Dinheiro</option>
        </select>
      </div>
      <button class="btn" onclick="confirmPayment()">Pagar</button>
      <button class="btn btn-outline" onclick="closePaymentModal()">Cancelar</button>
    </div>
  </div>

  <script src="js/toast.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
