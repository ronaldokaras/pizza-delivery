<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Pizzaria</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">🍕 Pizzaria Delícia</div>
    <div><a href="index.html">Voltar ao Cardápio</a></div>
  </nav>

  <div class="container register-container">
    <div class="card">
      <h2>Criar Conta</h2>
      <form id="registerForm">
        <div class="form-group">
          <label for="name">Nome</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" required minlength="6">
        </div>
        <div class="form-group">
          <label for="address">Endereço de entrega</label>
          <input type="text" id="address" placeholder="Rua, número, bairro, cidade" required>
        </div>
        <button type="submit" class="btn">Cadastrar</button>
      </form>
      <p class="register-login">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </div>

  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
